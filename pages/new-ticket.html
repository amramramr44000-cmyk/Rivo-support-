<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فتح بلاغ — Rivo Support</title><link rel="stylesheet" href="../css/style.css?v=20260902-ux14"></head><body data-page="new-ticket"><div class="shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark support-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M4 13v3a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2Z"/><path d="M20 13v3a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2Z"/><path d="M17 18c-.7 1.2-1.8 2-3.5 2H12"/></svg></span><span>Rivo Support<small>Support Center</small></span></a><nav id="nav" class="nav"></nav></header><div class="page-head"><div><span class="eyebrow" data-i18n="newTicketEyebrow">فتح بلاغ</span><h1 data-i18n="newTicketTitle">ما المشكلة؟</h1><p class="muted" data-i18n="newTicketDesc">اكتب التفاصيل باختصار ووضوح. يمكنك إرفاق الصور داخل المحادثة بعد فتح البلاغ.</p></div></div><section class="card" style="max-width:860px;margin:auto"><form id="ticketForm" class="form-grid"><div class="field"><span data-i18n="subject">عنوان المشكلة</span><input id="subject" class="input" required maxlength="120" data-i18n-placeholder="subjectPh" placeholder="مثال: لا أستطيع تسجيل الدخول"></div><div class="field"><span data-i18n="category">القسم</span><select id="category"><option value="account" data-i18n="catAccount">الحساب وتسجيل الدخول</option><option value="technical" data-i18n="catTechnical">مشكلة تقنية</option><option value="payment" data-i18n="catPayment">الدفع والاشتراكات</option><option value="report" data-i18n="catReport">إبلاغ عن مشكلة أو إساءة</option><option value="privacy" data-i18n="catPrivacy">الخصوصية والأمان</option><option value="other" data-i18n="catOther">أخرى</option></select></div><div class="field"><span data-i18n="priority">الأولوية</span><sele
